<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { height: auto; }
  #root { display: flow-root; }
  body { margin: 0; font-family: 'DM Sans', system-ui, sans-serif; color: #141833; background: transparent; }
  .head { display: flex; justify-content: space-between; align-items: baseline; margin: 2px 2px 6px; }
  .head h4 { margin: 0; font-size: 13px; color: #5d6384; font-weight: 600; }
  .head span { font-size: 12px; color: #5d6384; }
  .hint { font-size: 12px; color: #8a8fb0; padding: 6px 2px; }

  .bin { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; }
  .bitem { flex: 0 0 auto; width: 120px; cursor: grab; position: relative; touch-action: none; user-select: none; }
  .bitem img, .noimg { width: 120px; height: 68px; object-fit: cover; border-radius: 8px; border: 1px solid #dde0f0;
                       background: #1d2350; display: block; }
  .bitem .n { font-size: 11px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bitem .d { font-size: 10px; color: #8a8fb0; }

  img { -webkit-user-drag: none; user-select: none; }
  .plus { position: absolute; top: 5px; right: 5px; width: 24px; height: 24px; padding: 0; border-radius: 999px;
          background: #4a3fe0; color: #fff; border: 0; font-size: 16px; line-height: 24px; text-align: center; cursor: pointer; }
  .plus:hover { background: #3a30c0; color: #fff; }
  .ins { flex: 0 0 auto; width: 6px; align-self: stretch; min-height: 112px; background: #4a3fe0; border-radius: 3px; }
  .ghost { position: fixed; z-index: 99; width: 130px; pointer-events: none; opacity: .92; background: #fff;
           border: 2px solid #4a3fe0; border-radius: 10px; padding: 4px; box-shadow: 0 8px 22px rgba(20,24,51,.3); }
  .ghost img { width: 100%; height: 66px; object-fit: cover; border-radius: 6px; display: block; }
  .ghost span { display: block; font-size: 11px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body.dragging-now, body.dragging-now * { cursor: grabbing !important; }
  .track { display: flex; gap: 12px; align-items: flex-start; overflow-x: auto; padding: 14px; min-height: 190px;
           background: #f3f4fc; border: 1px solid #dde0f0; border-radius: 14px; }
  .track.over { outline: 2px dashed #4a3fe0; outline-offset: -6px; }
  .card { flex: 0 0 auto; width: 156px; background: #fff; border: 2px solid #dde0f0; border-radius: 12px;
          padding: 6px; cursor: grab; position: relative; user-select: none; touch-action: none; }
  .card.sel { border-color: #0b57d0; box-shadow: 0 0 0 3px rgba(11,87,208,.15); }
  .card.dragging { opacity: .35; }
  .card img, .card .noimg { width: 100%; height: 82px; object-fit: cover; border-radius: 8px; display: block;
                            background: #1d2350; pointer-events: none; }
  .badge { position: absolute; top: 10px; left: 10px; background: rgba(20,24,51,.75); color: #fff; font-size: 11px;
           padding: 1px 7px; border-radius: 999px; }
  .len { position: absolute; top: 10px; right: 10px; background: rgba(20,24,51,.75); color: #fff; font-size: 11px;
         padding: 1px 7px; border-radius: 999px; }
  .name { font-size: 12px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 5px; background: #e4e6f5; border-radius: 3px; margin-top: 5px; position: relative; overflow: hidden; }
  .bar i { position: absolute; top: 0; bottom: 0; background: #4a3fe0; border-radius: 3px; }
  .addcard { flex: 0 0 auto; min-width: 110px; height: 112px; border: 2px dashed #b8bcdc; border-radius: 12px; color: #8a8fb0;
             display: flex; align-items: center; justify-content: center; font-size: 12px; text-align: center; padding: 6px; }

  .insp { margin-top: 10px; background: #fff; border: 1px solid #dde0f0; border-radius: 14px; padding: 10px 12px;
          display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
  .insp .t { font-size: 13px; font-weight: 600; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .f { display: flex; flex-direction: column; font-size: 11px; color: #5d6384; gap: 3px; }
  .f input { width: 92px; padding: 6px 8px; border: 1px solid #dde0f0; border-radius: 8px; background: #fbfbff;
             color: #141833; font-size: 13px; }
  button { font: inherit; font-size: 12px; font-weight: 600; padding: 7px 11px; border-radius: 9px; cursor: pointer;
           border: 1px solid #dde0f0; background: #fff; color: #141833; }
  button:hover { border-color: #4a3fe0; color: #4a3fe0; }
  button.danger:hover { border-color: #c0392b; color: #c0392b; }
  .sp { flex: 1; }
</style>
</head>
<body>
<div id="root">
<div class="head"><h4>Media bin &nbsp;·&nbsp; drag a video onto the timeline, or click its +</h4></div>
<div class="bin" id="bin"></div>

<div class="head"><h4>Timeline &nbsp;·&nbsp; drag scenes to reorder, click to edit</h4><span id="total"></span></div>
<div class="track" id="track"></div>

<div class="insp" id="insp"></div>
</div>

<script>
  let args = {}, clips = [], bin = [], sel = null, lastVer = null, drag = null;
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const uid = () => "c" + Math.random().toString(36).slice(2, 9);
  const r2 = x => Math.round(x * 100) / 100;
  function fmt(t) { t = Math.max(0, +t || 0); const m = Math.floor(t / 60); return m + ":" + (t - m * 60).toFixed(1).padStart(4, "0"); }

  // ---- Streamlit component protocol (no build step needed)
  function send(type, data) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), "*"); }
  let lastH = 0;
  function fit() {      // measure the content itself: scrollHeight of the page never shrinks and made the frame grow
    const h = Math.ceil($("root").getBoundingClientRect().height) + 8;
    if (h !== lastH) { lastH = h; send("streamlit:setFrameHeight", { height: h }); }
  }
  function emit() {
    send("streamlit:setComponentValue", { dataType: "json", value: {
      selected: sel,
      clips: clips.map(c => ({ id: c.id, path: c.path, name: c.name, start: c.start, end: c.end,
                               volume: c.volume, dur: c.dur, audio: c.audio }))
    }});
  }
  window.addEventListener("message", ev => {
    if (!ev.data || ev.data.type !== "streamlit:render") return;
    args = ev.data.args || {};
    bin = args.bin || [];
    if (args.version !== lastVer) {             // Python added/replaced clips: take its list
      lastVer = args.version;
      clips = (args.clips || []).map(c => Object.assign({}, c));
      if (!clips.find(c => c.id === sel)) sel = clips.length ? clips[0].id : null;
      render(); emit();
    } else { render(); }
  });
  send("streamlit:componentReady", { apiVersion: 1 });

  // ---- model helpers
  function addFromBin(i, at) {
    const b = bin[i]; if (!b) return;
    const c = { id: uid(), path: b.path, name: b.name, start: 0, end: r2(b.dur), volume: 100,
                dur: b.dur, audio: b.audio, thumb: b.thumb };
    clips.splice(at == null ? clips.length : at, 0, c);
    sel = c.id; render(); emit();
  }
  const cur = () => clips.find(c => c.id === sel);

  // ---- render
  function render() {
    $("bin").innerHTML = bin.length ? bin.map((b, i) =>
      `<div class="bitem" data-bi="${i}" title="${esc(b.path)}"><button class="plus" data-add="${i}" title="Add to the end">+</button>` +
      (b.thumb ? `<img src="${b.thumb}" draggable="false">` : `<div class="noimg"></div>`) +
      `<div class="n">${esc(b.name)}</div><div class="d">${fmt(b.dur)}</div></div>`).join("")
      : `<span class="hint">No videos in your outputs folders yet. Add some with the controls above.</span>`;

    $("track").innerHTML = clips.map((c, i) => {
      const len = Math.max(0, c.end - c.start), d = c.dur || 1;
      return `<div class="card ${c.id === sel ? "sel" : ""}" data-i="${i}">` +
        (c.thumb ? `<img src="${c.thumb}" draggable="false">` : `<div class="noimg"></div>`) +
        `<span class="badge">${i + 1}</span><span class="len">${fmt(len)}</span>` +
        `<div class="name" title="${esc(c.name)}">${esc(c.name)}</div>` +
        `<div class="bar"><i style="left:${(c.start / d * 100).toFixed(1)}%;width:${(len / d * 100).toFixed(1)}%"></i></div></div>`;
    }).join("") + `<div class="addcard">${clips.length ? "drop here" : "Drag a video here, or click + on it"}</div>`;

    const tot = clips.reduce((s, c) => s + Math.max(0, c.end - c.start), 0);
    $("total").textContent = clips.length ? `${clips.length} scene${clips.length > 1 ? "s" : ""} · ${fmt(tot)}` : "";

    const c = cur(), el = $("insp");
    if (!c) { el.innerHTML = `<span class="hint">Select a scene to cut it, change its volume, split or delete it.</span>`; fit(); return; }
    el.innerHTML =
      `<div class="t">Scene ${clips.indexOf(c) + 1}: ${esc(c.name)} <span style="font-weight:400;color:#8a8fb0">(${fmt(c.dur)} long${c.audio ? "" : ", no sound"})</span></div>` +
      `<label class="f">Start (s)<input id="i_start" type="number" step="0.1" min="0" value="${c.start}"></label>` +
      `<label class="f">End (s)<input id="i_end" type="number" step="0.1" min="0" value="${c.end}"></label>` +
      `<label class="f">Volume %<input id="i_vol" type="number" step="5" min="0" max="300" value="${c.volume}"></label>` +
      `<label class="f">Split at (s)<input id="i_split" type="number" step="0.1" value="${r2((c.start + c.end) / 2)}"></label>` +
      `<button id="b_split">Split</button><span class="sp"></span>` +
      `<button id="b_left">&larr;</button><button id="b_right">&rarr;</button>` +
      `<button id="b_dup">Duplicate</button><button id="b_del" class="danger">Delete</button>`;
    $("i_start").onchange = e => { c.start = r2(Math.min(Math.max(0, +e.target.value || 0), c.end - 0.1)); render(); emit(); };
    $("i_end").onchange = e => { c.end = r2(Math.max(Math.min(c.dur, +e.target.value || c.dur), c.start + 0.1)); render(); emit(); };
    $("i_vol").onchange = e => { c.volume = Math.min(300, Math.max(0, Math.round(+e.target.value || 0))); render(); emit(); };
    $("b_split").onclick = () => {
      const t = +$("i_split").value;
      if (!(t > c.start + 0.1 && t < c.end - 0.1)) { $("i_split").style.borderColor = "#c0392b"; return; }
      const second = Object.assign({}, c, { id: uid(), start: r2(t) });
      c.end = r2(t); clips.splice(clips.indexOf(c) + 1, 0, second); sel = second.id; render(); emit();
    };
    $("b_left").onclick = () => { const i = clips.indexOf(c); if (i > 0) { clips.splice(i, 1); clips.splice(i - 1, 0, c); render(); emit(); } };
    $("b_right").onclick = () => { const i = clips.indexOf(c); if (i < clips.length - 1) { clips.splice(i, 1); clips.splice(i + 1, 0, c); render(); emit(); } };
    $("b_dup").onclick = () => { const d = Object.assign({}, c, { id: uid() }); clips.splice(clips.indexOf(c) + 1, 0, d); sel = d.id; render(); emit(); };
    $("b_del").onclick = () => { const i = clips.indexOf(c); clips.splice(i, 1);
      sel = clips.length ? clips[Math.min(i, clips.length - 1)].id : null; render(); emit(); };
    fit();
  }

  // ---- drag and drop (pointer based: more reliable than native HTML5 drag inside an iframe)
  let pend = null;          // mouse is down on a bin item or a scene, not yet moved far enough to be a drag
  let dr = null;            // active drag
  const ins = document.createElement("div"); ins.className = "ins";

  document.addEventListener("pointerdown", e => {
    if (e.button !== 0 || e.target.closest(".plus")) return;
    const card = e.target.closest(".card"), b = e.target.closest(".bitem");
    if (!card && !b) return;
    pend = { kind: card ? "clip" : "bin", i: +(card ? card.dataset.i : b.dataset.bi),
             x: e.clientX, y: e.clientY, id: e.pointerId, el: card || b };
    try { pend.el.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault();
  });

  function startDrag() {
    const src = pend.kind === "clip" ? clips[pend.i] : bin[pend.i];
    const g = document.createElement("div"); g.className = "ghost";
    g.innerHTML = (src.thumb ? `<img src="${src.thumb}">` : "") + `<span>${esc(src.name)}</span>`;
    document.body.appendChild(g);
    dr = { kind: pend.kind, i: pend.i, ghost: g, at: null };
    if (pend.kind === "clip") pend.el.classList.add("dragging");
    document.body.classList.add("dragging-now");
  }

  function moveDrag(e) {
    dr.ghost.style.left = (e.clientX + 12) + "px";
    dr.ghost.style.top = (e.clientY + 12) + "px";
    const tr = $("track"), r = tr.getBoundingClientRect();
    const inside = e.clientX >= r.left - 12 && e.clientX <= r.right + 12 && e.clientY >= r.top - 40 && e.clientY <= r.bottom + 40;
    if (!inside) { dr.at = null; ins.remove(); tr.classList.remove("over"); return; }
    tr.classList.add("over");
    if (e.clientX < r.left + 40) tr.scrollLeft -= 16; else if (e.clientX > r.right - 40) tr.scrollLeft += 16;
    const cards = Array.from(tr.querySelectorAll(".card"));
    let at = cards.length;
    for (let k = 0; k < cards.length; k++) {
      const cr = cards[k].getBoundingClientRect();
      if (e.clientX < cr.left + cr.width / 2) { at = k; break; }
    }
    dr.at = at;
    tr.insertBefore(ins, cards[at] || tr.querySelector(".addcard"));
  }

  document.addEventListener("pointermove", e => {
    if (!pend || e.pointerId !== pend.id) return;
    if (!dr) {
      if (Math.hypot(e.clientX - pend.x, e.clientY - pend.y) < 6) return;
      startDrag();
    }
    moveDrag(e);
  });

  function finish(cancel) {
    if (!pend) return;
    const p = pend; pend = null;
    try { p.el.releasePointerCapture(p.id); } catch (_) {}
    if (dr) {
      const d = dr; dr = null;
      d.ghost.remove(); ins.remove();
      $("track").classList.remove("over");
      document.body.classList.remove("dragging-now");
      document.querySelectorAll(".dragging").forEach(x => x.classList.remove("dragging"));
      if (cancel || d.at == null) return;
      if (d.kind === "bin") { addFromBin(d.i, d.at); }
      else {
        let at = d.at; const from = d.i, c = clips.splice(from, 1)[0];
        if (at > from) at--;
        clips.splice(at, 0, c); sel = c.id; render(); emit();
      }
      return;
    }
    if (!cancel && p.kind === "clip") { sel = clips[p.i].id; render(); emit(); }   // a plain click selects
  }
  document.addEventListener("pointerup", e => { if (pend && e.pointerId === pend.id) finish(false); });
  document.addEventListener("pointercancel", e => { if (pend && e.pointerId === pend.id) finish(true); });
  window.addEventListener("blur", () => finish(true));

  // + button and double-click add a bin video at the end
  $("bin").addEventListener("click", e => {
    const p = e.target.closest(".plus");
    if (p) addFromBin(+p.dataset.add);
  });
  $("bin").addEventListener("dblclick", e => {
    const b = e.target.closest(".bitem");
    if (b) addFromBin(+b.dataset.bi);
  });
  window.addEventListener("resize", fit);
</script>
</body>
</html>
